<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <defs>
    <style>
      .bg { fill: #0b1220; }
      .card { fill: #101a2f; stroke: #223152; stroke-width: 2; rx: 18; }
      .muted { fill: #8aa0c2; font-family: Inter, Arial, sans-serif; font-size: 16px; }
      .title { fill: #e8f0ff; font-family: Inter, Arial, sans-serif; font-size: 28px; font-weight: 700; }
      .h2 { fill: #e8f0ff; font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 700; }
      .kpiLabel { fill: #8aa0c2; font-family: Inter, Arial, sans-serif; font-size: 14px; }
      .kpiValue { fill: #e8f0ff; font-family: Inter, Arial, sans-serif; font-size: 22px; font-weight: 700; }
      .pill { fill: #1a2a4a; stroke: #2b4374; stroke-width: 1.5; rx: 14; }
      .pillText { fill: #bcd0f7; font-family: Inter, Arial, sans-serif; font-size: 13px; }
      .axis { stroke: #2a3b61; stroke-width: 1; }
      .grid { stroke: #1e2b46; stroke-width: 1; }
      .line1 { stroke: #7c3aed; stroke-width: 3; fill: none; }
      .line2 { stroke: #22c55e; stroke-width: 3; fill: none; }
      .line3 { stroke: #60a5fa; stroke-width: 3; fill: none; }
      .legend { fill: #bcd0f7; font-family: Inter, Arial, sans-serif; font-size: 13px; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="800" />

  <text class="title" x="50" y="60">FP&amp;A SaaS Financial Planning Dashboard (Mock Preview)</text>
  <text class="muted" x="50" y="90">Actuals vs Forecast • Driver-based Scenarios • Cash Runway</text>

  <!-- Sidebar -->
  <rect class="card" x="50" y="120" width="320" height="630" />
  <text class="h2" x="75" y="160">Scenario Drivers</text>

  <rect class="pill" x="75" y="185" width="270" height="34" />
  <text class="pillText" x="90" y="207">Months to project: 24</text>

  <rect class="pill" x="75" y="235" width="270" height="34" />
  <text class="pillText" x="90" y="257">Growth uplift: +5%</text>

  <rect class="pill" x="75" y="285" width="270" height="34" />
  <text class="pillText" x="90" y="307">Churn delta: +0.0%</text>

  <rect class="pill" x="75" y="335" width="270" height="34" />
  <text class="pillText" x="90" y="357">ARPA uplift: +3%</text>

  <rect class="pill" x="75" y="385" width="270" height="34" />
  <text class="pillText" x="90" y="407">Headcount delta: +5</text>

  <rect class="pill" x="75" y="435" width="270" height="34" />
  <text class="pillText" x="90" y="457">Cloud cost uplift: +5%</text>

  <text class="muted" x="75" y="515">Scenarios</text>
  <rect class="pill" x="75" y="535" width="270" height="34" />
  <text class="pillText" x="90" y="557">Bear • Base • Bull</text>

  <text class="muted" x="75" y="605">This is a mock image.</text>
  <text class="muted" x="75" y="630">Replace with real screenshots.</text>

  <!-- KPI Row -->
  <rect class="card" x="395" y="120" width="955" height="120" />

  <!-- KPI cards -->
  <g transform="translate(420,140)">
    <rect class="pill" x="0" y="0" width="130" height="80" rx="16" />
    <text class="kpiLabel" x="14" y="26">ARR</text>
    <text class="kpiValue" x="14" y="58">$12.4M</text>
  </g>
  <g transform="translate(565,140)">
    <rect class="pill" x="0" y="0" width="150" height="80" rx="16" />
    <text class="kpiLabel" x="14" y="26">Revenue</text>
    <text class="kpiValue" x="14" y="58">$1.10M</text>
  </g>
  <g transform="translate(730,140)">
    <rect class="pill" x="0" y="0" width="170" height="80" rx="16" />
    <text class="kpiLabel" x="14" y="26">Gross Margin %</text>
    <text class="kpiValue" x="14" y="58">72.5%</text>
  </g>
  <g transform="translate(915,140)">
    <rect class="pill" x="0" y="0" width="140" height="80" rx="16" />
    <text class="kpiLabel" x="14" y="26">Operating Inc.</text>
    <text class="kpiValue" x="14" y="58">-$80K</text>
  </g>
  <g transform="translate(1070,140)">
    <rect class="pill" x="0" y="0" width="150" height="80" rx="16" />
    <text class="kpiLabel" x="14" y="26">Ending Cash</text>
    <text class="kpiValue" x="14" y="58">$4.2M</text>
  </g>
  <g transform="translate(1235,140)">
    <rect class="pill" x="0" y="0" width="95" height="80" rx="16" />
    <text class="kpiLabel" x="14" y="26">Runway</text>
    <text class="kpiValue" x="14" y="58">18m</text>
  </g>

  <!-- Charts Row -->
  <rect class="card" x="395" y="260" width="610" height="240" />
  <text class="h2" x="420" y="300">Revenue: Actual vs Forecast</text>

  <!-- Revenue chart axes/grid -->
  <line class="axis" x1="420" y1="465" x2="980" y2="465" />
  <line class="axis" x1="420" y1="330" x2="420" y2="465" />
  <line class="grid" x1="420" y1="430" x2="980" y2="430" />
  <line class="grid" x1="420" y1="395" x2="980" y2="395" />
  <line class="grid" x1="420" y1="360" x2="980" y2="360" />

  <path class="line1" d="M420,440 C520,420 560,410 640,390 C720,370 780,380 840,360 C900,340 940,350 980,335" />
  <path class="line3" d="M760,375 C820,365 870,360 920,350 C950,345 965,342 980,338" />
  <text class="legend" x="420" y="490">Purple = Actuals • Blue = Forecast</text>

  <!-- Scenario Table -->
  <rect class="card" x="1020" y="260" width="330" height="240" />
  <text class="h2" x="1045" y="300">Scenario Summary</text>
  <text class="muted" x="1045" y="330">(End of projection)</text>

  <!-- Table rows -->
  <rect class="pill" x="1045" y="350" width="280" height="34" />
  <text class="pillText" x="1060" y="372">Bear:  ARR ↓ • Cash ↓</text>

  <rect class="pill" x="1045" y="395" width="280" height="34" />
  <text class="pillText" x="1060" y="417">Base:  ARR → • Cash →</text>

  <rect class="pill" x="1045" y="440" width="280" height="34" />
  <text class="pillText" x="1060" y="462">Bull:  ARR ↑ • Cash ↑</text>

  <!-- Scenario Trends -->
  <rect class="card" x="395" y="520" width="955" height="230" />
  <text class="h2" x="420" y="560">Scenario Trends: ARR / Operating Income / Cash</text>

  <line class="axis" x1="420" y1="715" x2="1325" y2="715" />
  <line class="axis" x1="420" y1="590" x2="420" y2="715" />

  <path class="line2" d="M420,700 C540,690 650,675 770,660 C920,640 1080,625 1325,605" />
  <path class="line1" d="M420,705 C540,700 650,695 770,690 C920,685 1080,680 1325,675" />
  <path class="line3" d="M420,710 C540,705 650,700 770,695 C920,690 1080,682 1325,660" />

  <text class="legend" x="420" y="745">Green=Bull • Purple=Bear • Blue=Base (example lines)</text>
</svg>
